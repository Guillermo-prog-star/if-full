spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: integrity-family

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:integrity_family}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&connectTimeout=10000&useUnicode=true&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root123}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      initialization-fail-timeout: 60000
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 5000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:${RABBITMQ_HOST:localhost}}
    port: ${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
    username: ${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USER:guest}}
    password: ${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:guest}}
    listener:
      simple:
        auto-startup: ${RABBITMQ_ENABLED:false}
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 3
          max-interval: 10000ms
          multiplier: 2.0
    template:
      retry:
        enabled: false
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080
  address: 0.0.0.0
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true          # Fuerza UTF-8 en request Y response
      force-request: true
      force-response: true
  error:
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:always}
    include-binding-errors: ${SERVER_ERROR_INCLUDE_BINDING_ERRORS:always}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: false

# ---------- Configuración de la Aplicación ----------
app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:4200}
  ai:
    voice:
      enabled: ${APP_AI_VOICE_ENABLED:false}
    anthropic:
      enabled: ${CLAUDE_ENABLED:true}
      api-key: ${CLAUDE_API_KEY:MOCK_KEY}
      model: ${CLAUDE_MODEL:claude-haiku-4-5}
      base-url: ${CLAUDE_BASE_URL:https://api.anthropic.com/v1}
    gemini:
      enabled: ${GEMINI_ENABLED:false}
      api-key: ${GEMINI_API_KEY:MOCK_KEY}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    deepseek:
      enabled: ${DEEPSEEK_ENABLED:false}
      api-key: ${DEEPSEEK_API_KEY:MOCK_KEY}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    openai:
      api-key: ${OPENAI_API_KEY:MOCK_KEY}
      whisper:
        enabled: ${WHISPER_ENABLED:false}
        url: ${APP_AI_OPENAI_WHISPER_URL:https://api.openai.com/v1/audio/transcriptions}
        model: ${APP_AI_OPENAI_WHISPER_MODEL:whisper-1}
        timeout-ms: ${APP_AI_OPENAI_WHISPER_TIMEOUT_MS:30000}
    elevenlabs:
      enabled: ${ELEVENLABS_ENABLED:false}
      api-key: ${ELEVENLABS_API_KEY:MOCK_KEY}
      voice-id: ${ELEVENLABS_VOICE_ID:MOCK_VOICE}
      model: ${ELEVENLABS_MODEL:eleven_multilingual_v2}
      base-url: ${ELEVENLABS_BASE_URL:https://api.elevenlabs.io/v1}
  alexa:
    enabled: ${ALEXA_ENABLED:false}
    skill-id: ${ALEXA_SKILL_ID:}
    client-id: ${ALEXA_CLIENT_ID:integrity-family}
    token-ttl-seconds: ${ALEXA_TOKEN_TTL:3600}
    code-ttl-seconds: ${ALEXA_CODE_TTL:300}

# ---------- WhatsApp (Meta Cloud API) ----------
whatsapp:
  api:
    url: ${WHATSAPP_API_URL:https://graph.facebook.com/v17.0/${WHATSAPP_PHONE_NUMBER_ID:12345}/messages}
    token: ${WHATSAPP_TOKEN:MOCK_TOKEN}
  notifications:
    enabled: ${WHATSAPP_NOTIFICATIONS_ENABLED:true}
    # Tipos de notificación que disparan WhatsApp (alta prioridad)
    priority-types: >
      RISK_CRITICAL_ALERT,TRAJECTORY_RELAPSED,TRAJECTORY_RELAPSE_REMINDER,
      TRAJECTORY_SUGGESTION_URGENT,TRAJECTORY_SAFETY_PROTOCOL_URGENT,TRAJECTORY_DETECTED_SAFETY_PROTOCOL,
      SAFETY_PROTOCOL_ACTIVATED,SENTINEL_ALERT,CRISIS_ALERT,PLAN_ASSIGNED

logging:
  file:
    name: /app/logs/backend.log
  level:
    org.hibernate.SQL: WARN

# ---------- Configuración de Seguridad JWT ----------
integrity:
  security:
    jwt:
      # Sin valor por defecto a proposito: un secreto HMAC publico en el repo permite
      # firmar tokens arbitrarios (sub / fid / role=ROLE_ADMIN) y saltarse toda la
      # autenticacion y la autorizacion por familia. Si falta JWT_SECRET, el arranque
      # debe fallar fuerte -- mismo criterio que family-home.id-secret.
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    family-home:
      # Sin valor por defecto a proposito: un secreto publico en el repo permitiria
      # enumerar family_id/user_id offline y calcular su UUID sin acceso a la BD
      # (ver FamilyIdentifierBridge). Si falta la variable de entorno, el arranque
      # debe fallar fuerte en vez de degradar en silencio a un secreto inseguro.
      id-secret: ${FAMILY_HOME_ID_SECRET}


---
# Perfil 'voice': activa toda la cadena de IA por voz
spring:
  config:
    activate:
      on-profile: voice
app:
  ai:
    voice:
      enabled: true
    openai:
      whisper:
        enabled: true
    elevenlabs:
      enabled: true

---
# Perfil 'prod': configuración para producción
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

server:
  error:
    include-message: never
    include-binding-errors: never

# Deshabilitar Swagger en producción
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.integrityfamily: INFO
    org.hibernate.SQL: WARN

---
# Perfil 'railway': despliegue en Railway.app
# Variables de entorno requeridas en el servicio Railway:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#   JWT_SECRET, CLAUDE_API_KEY (opcional)
spring:
  config:
    activate:
      on-profile: railway
  jpa:
    hibernate:
      ddl-auto: update     # Railway recrea el contenedor en cada deploy
    show-sql: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false  # Sin RabbitMQ en Railway (plano Starter)

# Logs a stdout — Railway los captura automáticamente
logging:
  file:
    name: ""               # Sin archivo de log en Railway
  level:
    com.integrityfamily: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    rabbit:
      enabled: false

---
# Perfil 'render': despliegue en Render.com
# Variables de entorno requeridas en el dashboard de Render:
#   SPRING_DATASOURCE_URL  → jdbc:mysql://<RAILWAY_PUBLIC_HOST>:<PORT>/<DB>?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
#   SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#   JWT_SECRET, CLAUDE_API_KEY (opcional)
spring:
  config:
    activate:
      on-profile: render
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

logging:
  file:
    name: ""
  level:
    com.integrityfamily: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    rabbit:
      enabled: false
